t) }}</mark>{%- endif -%}{%- for g in (state_attr('sensor.jellyha_latest_episode', 'genres') or [])[:3] -%}<em class="badge-genre" style="background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.92); font-size: 0.72rem; font-weight: 500; font-style: normal; padding: 1px 6px; border-radius: 4px; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,0.6); display: inline-block; white-space: nowrap; margin-right: 8px; margin-bottom: 4px;">{{ g }}</em>{%- endfor -%}</div><p style="margin: 0; line-height: 1.35; font-size: 0.82rem; color: rgba(255,255,255,0.9); text-shadow: 0 2px 6px rgba(0,0,0,0.95); overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{ state_attr('sensor.jellyha_latest_episode', 'overview') }}</p></td></tr></table>
